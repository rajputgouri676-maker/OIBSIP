
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | Gouri Rajput</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter">
        <p class="subtitle">SMART TEMPERATURE TOOL</p>
        <h1>Temperature Converter</h1>
        <p class="description">
            Convert temperatures quickly and accurately.
        </p>

        <form id="converterForm">
            <label for="temperature">Enter temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="e.g. 37"
                step="any"
                required
            >

            <label for="fromUnit">Convert from</label>
            <select id="fromUnit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <label for="toUnit">Convert to</label>
            <select id="toUnit">
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Convert Temperature</button>
            <button type="reset" class="reset-btn">Reset</button>

            <p id="error" role="alert"></p>

            <div class="result" aria-live="polite">
                <p>Converted Temperature</p>
                <h2 id="result">--</h2>
            </div>
        </form>

        <a class="back-link" href="../WebDev-L1-Portfolio/index.html">
            ← Back to Portfolio
        </a>
    </main>

    <script src="script.js"></script>
</body>
</html>
